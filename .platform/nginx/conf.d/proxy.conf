# Menu Hero Core — settings for the HOST nginx that Elastic Beanstalk runs on
# the EC2 instance (Docker platform, Amazon Linux 2023).
#
# Files in .platform/nginx/conf.d/ are dropped into /etc/nginx/conf.d/ and
# included inside the `http` block of EB's own nginx.conf, so only http-level
# directives belong here.
#
# The host nginx does exactly one thing: forward :80 to the container's
# EXPOSEd port 8080. The /api vs / routing happens INSIDE the container
# (deploy/nginx/nginx.conf), so this layer only needs to be as permissive as
# the in-container proxy — same body limit, same timeouts, no buffering
# (the /api/agents/stream endpoint is a text/event-stream response).

client_max_body_size 10m;
proxy_read_timeout 300s;
proxy_send_timeout 300s;
proxy_buffering off;
