[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "menu-hero-agents"
version = "0.1.0"
description = "Framework-agnostic AI agent package for Menu Hero (import name: agents)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11", "pydantic-settings>=2.10"]

[project.optional-dependencies]
# none needed now

[dependency-groups]
dev = ["pytest>=9", "pytest-asyncio>=1.0", "ruff>=0.12", "mypy>=1.17"]

[tool.setuptools]
# The pyproject lives INSIDE the package directory: "." is the `agents` package itself.
package-dir = { "agents" = "." }
packages = [
    "agents",
    "agents.core",
    "agents.schemas",
    "agents.memory",
    "agents.tools",
    "agents.integrations",
    "agents.implementations",
    "agents.workflows",
]
# Explicit package list above means tests/, .venv/, build/ and dist/ are never packaged.
include-package-data = false

[tool.setuptools.package-data]
agents = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.isort]
known-first-party = ["agents"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
exclude = ["^\\.venv/", "^build/", "^dist/"]
plugins = ["pydantic.mypy"]
