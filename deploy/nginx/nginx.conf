# Menu Hero Core — in-container nginx for the production image (`app` stage).
#
# Started by supervisord as:  nginx -c /app/deploy/nginx/nginx.conf -g "daemon off;"
#
# It runs as the unprivileged `app` user, so every path nginx writes to (pid,
# temp directories) lives under /tmp and logs go straight to stdout/stderr.
#
# Routing (contract §2), one origin for the browser:
#   /api/  ->  FastAPI / uvicorn  127.0.0.1:8000   (unbuffered, 300s: SSE + slow agents)
#   /      ->  Nuxt / Nitro       127.0.0.1:3000   (websocket-capable for HMR-style upgrades)
#
# On Elastic Beanstalk the host nginx forwards :80 to this container's :8080
# (see .platform/nginx/conf.d/proxy.conf); no /api vs / logic lives up there.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout main;

    # Writable scratch paths for a non-root nginx (the compiled-in defaults
    # live under /var/lib/nginx). nginx creates these on start-up.
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    upstream backend {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    upstream frontend {
        server 127.0.0.1:3000;
        keepalive 32;
    }

    # WebSocket upgrade passthrough for the frontend location.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Preserve the scheme reported by an upstream TLS terminator (ELB / host
    # nginx); fall back to our own scheme when nobody set the header.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    server {
        listen 8080;
        server_name _;

        client_max_body_size 10m;

        # --- API: FastAPI ---------------------------------------------------
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

            # Streaming responses (text/event-stream) must not be buffered.
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # --- Everything else: Nuxt / Nitro -----------------------------------
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
