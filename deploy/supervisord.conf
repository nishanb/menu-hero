; Menu Hero Core — process supervisor for the production image (`app` stage).
;
; Started as PID 1 by the Dockerfile:  supervisord -c /app/deploy/supervisord.conf
; Runs as the unprivileged `app` user, so its pidfile/socket live under /tmp
; and every program's output is forwarded to the container's stdout/stderr.
;
; Start order (priority, lowest first): backend -> frontend -> nginx.
; nginx only proxies, so it does not matter if it comes up a moment early.
;
; UVICORN_WORKERS is expanded from the environment at config-parse time.
; supervisor has no "default value" syntax, so the Dockerfile sets
; UVICORN_WORKERS=2 and Elastic Beanstalk / docker run may override it.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
loglevel=info

; Optional local control socket so `supervisorctl status` works inside the
; container (docker exec <id> supervisorctl status). 0700 by default.
[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; --- FastAPI ----------------------------------------------------------------
[program:backend]
directory=/app/backend
command=/app/backend/.venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 --workers %(ENV_UVICORN_WORKERS)s
priority=10
autostart=true
autorestart=true
startsecs=3
startretries=5
stopsignal=TERM
stopwaitsecs=30
; uvicorn --workers forks children: stop/kill the whole process group.
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- Nuxt / Nitro -----------------------------------------------------------
[program:frontend]
directory=/app/frontend
command=/usr/bin/node .output/server/index.mjs
; Nitro listens on 127.0.0.1:3000 (nginx is the only client) and its server
; side proxies /api/* to FastAPI on the loopback interface.
environment=PORT="3000",HOST="127.0.0.1",NITRO_PORT="3000",NITRO_HOST="127.0.0.1",NUXT_API_PROXY_TARGET="http://127.0.0.1:8000",NODE_ENV="production"
priority=20
autostart=true
autorestart=true
startsecs=3
startretries=5
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- nginx (public :8080) ---------------------------------------------------
[program:nginx]
command=/usr/sbin/nginx -c /app/deploy/nginx/nginx.conf -g "daemon off;"
priority=30
autostart=true
autorestart=true
startsecs=2
startretries=5
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
